<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asset Ledger — Physical Verification &amp; Reconciliation</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="theme-color" content="#161a17">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   EDIT-ME: COLOURS & FONTS
   Everything in this file that most people would ever want to change —
   asset groups, locations, custom fields, tag formats, the firm name,
   the Google Drive/OneDrive link — is editable INSIDE the app itself,
   under the "Configuration" tab. You do NOT need to touch this file
   for any of that.
   The only things you can't change from inside the app are the colours,
   fonts, and general look-and-feel below. If you ever want to tweak
   those, see the separate "How to Edit This Tool" guide that came with
   this file — it explains, in plain language, exactly how.
   Quick rule while editing colours: only change the text INSIDE the
   quotes/after the colon and before the semicolon, e.g. change
   #a8732f to a different 6-character colour code, and leave everything
   else (the semicolons ; and curly brackets { }) exactly where they are.
   ===================================================================== */
:root{
  --bg-app:#eef2f1;
  --bg-panel:#ffffff;
  --bg-sidebar:#0f1c1c;
  --bg-sidebar-2:#182a29;
  --ink:#131a19;
  --ink-soft:#556361;
  --ink-faint:#8a9895;
  --line:#dbe3e0;
  --line-strong:#b7c4c0;
  --accent:#b8802e;
  --accent-dark:#8a5f20;
  --accent-soft:#f3e3c8;
  --teal:#1f9e8a;
  --teal-dark:#157566;
  --teal-soft:#e1f5f1;
  --good:#1f9e8a;
  --good-soft:#e1f5f1;
  --bad:#af4438;
  --bad-soft:#f6e2de;
  --warn:#b8802e;
  --warn-soft:#f3e3c8;
  --font-display:'Source Serif 4', Georgia, serif;
  --font-body:'IBM Plex Sans', system-ui, -apple-system, sans-serif;
  --font-mono:'IBM Plex Mono', 'SF Mono', monospace;
  --radius:4px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-body);
  background:var(--bg-app);
  color:var(--ink);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--accent-soft);}
a{color:var(--accent-dark);}
button{font-family:inherit;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:5px;}
::-webkit-scrollbar-track{background:transparent;}

/* ===== App shell ===== */
#app{display:flex;min-height:100vh;}

/* Sidebar */
.sidebar{
  width:220px;flex:0 0 220px;background:var(--bg-sidebar);
  color:#cfd6c9;display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{
  padding:22px 18px 16px;border-bottom:1px solid #2a2f27;
}
.brand .mark{
  font-family:var(--font-mono);font-size:10.5px;letter-spacing:.14em;
  color:var(--accent);text-transform:uppercase;margin-bottom:6px;
}
.brand .title{
  font-family:var(--font-display);font-size:19px;font-weight:600;color:#f3f1e8;
  line-height:1.25;
}
.brand .sub{font-size:11px;color:#8b9382;margin-top:4px;}
.firm-logo{display:flex;align-items:center;gap:10px;}
.firm-badge{
  flex:0 0 auto;width:38px;height:38px;border-radius:4px;background:linear-gradient(155deg, var(--accent), var(--accent-dark));
  color:#fff;font-family:var(--font-display);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;
  letter-spacing:.01em;box-shadow:0 2px 6px rgba(0,0,0,.35);
}
.firm-name{font-family:var(--font-display);font-size:14.5px;line-height:1.25;color:#f3f1e8;font-weight:600;}
.firm-logo-img{max-width:100%;height:auto;display:block;border-radius:4px;}

.nav{flex:1;padding:14px 10px;}
.nav-group{margin-bottom:4px;}
.nav-label{
  font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;
  color:#6d7566;text-transform:uppercase;padding:14px 12px 6px;
}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--radius);
  cursor:pointer;font-size:13.2px;color:#c8cfc1;margin-bottom:1px;border:1px solid transparent;
}
.nav-item .num{
  font-family:var(--font-mono);font-size:10.5px;color:#6d7566;width:16px;flex:0 0 16px;
}
.nav-item:hover{background:var(--bg-sidebar-2);color:#f0eee2;}
.nav-item.active{background:#262c22;color:#f6f2e6;border-color:#3a4133;}
.nav-item.active .num{color:var(--accent);}
.nav-badge{
  margin-left:auto;font-family:var(--font-mono);font-size:10.5px;background:#2b3226;
  color:#c8cfc1;padding:1px 6px;border-radius:9px;
}
.nav-badge.warn{background:var(--warn);color:#241704;}
.sidebar-foot{
  padding:12px 16px 16px;border-top:1px solid #2a2f27;font-size:11px;color:#7a8172;
}
.sidebar-foot button{
  width:100%;background:none;border:1px solid #3a4133;color:#c8cfc1;padding:7px;
  border-radius:var(--radius);font-size:11.5px;cursor:pointer;margin-top:8px;
}
.sidebar-foot button:hover{border-color:var(--accent);color:var(--accent-soft);}

/* Main */
.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 26px;border-bottom:1px solid var(--line);background:var(--bg-panel);
  position:sticky;top:0;z-index:20;
}
.topbar h1{
  font-family:var(--font-display);font-size:21px;font-weight:600;margin:0;color:var(--ink);
}
.topbar .crumb{font-size:11.5px;color:var(--ink-faint);font-family:var(--font-mono);letter-spacing:.03em;text-transform:uppercase;margin-bottom:2px;}
.topbar-actions{display:flex;gap:8px;align-items:center;}
.content{padding:24px 26px 60px;flex:1;}

/* Buttons */
.btn{
  font-size:12.5px;padding:8px 14px;border-radius:var(--radius);border:1px solid var(--line-strong);
  background:#fff;color:var(--ink);cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;
  transition:border-color .12s, background .12s;
}
.btn:hover{border-color:var(--ink-soft);}
.btn-primary{background:var(--ink);color:#f6f4ec;border-color:var(--ink);}
.btn-primary:hover{background:#000;}
.btn-accent{background:var(--accent);color:#fff;border-color:var(--accent-dark);}
.btn-accent:hover{background:var(--accent-dark);}
.btn-danger{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);}
.btn-danger:hover{background:var(--bad);color:#fff;}
.btn-ghost{background:none;border-color:transparent;color:var(--ink-soft);}
.btn-ghost:hover{background:#00000008;}
.btn-sm{padding:5px 9px;font-size:11.5px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}

/* Cards / panels */
.panel{background:var(--bg-panel);border:1px solid var(--line);border-radius:var(--radius);}
.panel-head{
  padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.panel-head h3{margin:0;font-family:var(--font-display);font-size:15.5px;font-weight:600;}
.panel-head .desc{font-size:11.5px;color:var(--ink-faint);margin-top:2px;}
.panel-body{padding:16px 18px;}

.grid{display:grid;gap:16px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media (max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-3{grid-template-columns:repeat(2,1fr);}}
@media (max-width:720px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr;}}

.stat-card{background:var(--bg-panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;position:relative;overflow:hidden;}
.stat-card .eyebrow{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);}
.stat-card .value{font-family:var(--font-display);font-size:30px;font-weight:600;margin-top:6px;color:var(--ink);}
.stat-card .foot{font-size:11.5px;color:var(--ink-soft);margin-top:4px;}
.stat-card.accent{border-color:var(--accent);}
.stat-card.accent::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);}
.stat-card.good::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--good);}
.stat-card.bad::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--bad);}

/* Tables */
.table-wrap{overflow-x:auto;}
table.dt{width:100%;border-collapse:collapse;font-size:12.6px;}
table.dt th{
  text-align:left;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--ink-faint);padding:8px 10px;border-bottom:1px solid var(--line-strong);white-space:nowrap;position:sticky;top:0;background:var(--bg-panel);
  cursor:pointer;user-select:none;
}
table.dt th:hover{color:var(--ink);}
table.dt td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;}
table.dt tr:hover td{background:#faf8f2;}
table.dt td.num, table.dt th.num{text-align:right;font-family:var(--font-mono);}
.tag-id{font-family:var(--font-mono);font-size:11.5px;background:#f1efe6;border:1px solid var(--line-strong);padding:1px 6px;border-radius:2px;}
.row-actions{display:flex;gap:5px;}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:10.8px;font-family:var(--font-mono);padding:2px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.03em;}
.pill.good{background:var(--good-soft);color:var(--good);}
.pill.bad{background:var(--bad-soft);color:var(--bad);}
.pill.warn{background:var(--warn-soft);color:var(--warn);}
.pill.neutral{background:#eceae0;color:var(--ink-soft);}

/* Forms */
label.field{display:block;margin-bottom:12px;}
label.field .lbl{display:block;font-size:11.5px;color:var(--ink-soft);margin-bottom:4px;font-weight:500;}
label.field .lbl .req{color:var(--bad);}
input[type=text],input[type=number],input[type=date],input[type=file],select,textarea{
  width:100%;padding:8px 10px;border:1px solid var(--line-strong);border-radius:var(--radius);
  font-family:inherit;font-size:13px;background:#fff;color:var(--ink);
}
textarea{resize:vertical;min-height:60px;}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent);}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;}
.form-grid.cols-3{grid-template-columns:1fr 1fr 1fr;}
@media (max-width:640px){.form-grid,.form-grid.cols-3{grid-template-columns:1fr;}}
.hint{font-size:11px;color:var(--ink-faint);margin-top:3px;}

/* Modal */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(20,22,17,.5);display:flex;align-items:flex-start;justify-content:center;
  padding:5vh 20px;z-index:100;overflow-y:auto;
}
.modal{
  background:var(--bg-panel);border-radius:var(--radius);width:100%;max-width:640px;border:1px solid var(--line-strong);
  box-shadow:0 20px 50px rgba(0,0,0,.25);
}
.modal.wide{max-width:920px;}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;}
.modal-head h3{margin:0;font-family:var(--font-display);font-size:17px;}
.modal-body{padding:18px 20px;max-height:70vh;overflow-y:auto;}
.modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;}
.modal-close{cursor:pointer;color:var(--ink-faint);background:none;border:none;font-size:18px;line-height:1;padding:2px 6px;}

/* Toast */
#toast-host{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{
  background:var(--ink);color:#f6f4ec;padding:10px 16px;border-radius:var(--radius);font-size:12.5px;
  box-shadow:0 6px 20px rgba(0,0,0,.2);border-left:3px solid var(--accent);min-width:220px;animation:toast-in .18s ease-out;
}
.toast.bad{border-left-color:var(--bad);}
.toast.good{border-left-color:var(--good);}
@keyframes toast-in{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

/* empty state */
.empty{padding:36px 20px;text-align:center;color:var(--ink-faint);}
.empty .glyph{font-family:var(--font-display);font-size:34px;color:var(--line-strong);margin-bottom:6px;}
.empty .msg{font-size:13px;}

/* Ledger match visual (signature element) */
.ledger{display:grid;grid-template-columns:1fr 40px 1fr;gap:0;align-items:stretch;}
.ledger .side{padding:14px 16px;}
.ledger .side.book{border-right:1px dashed var(--line-strong);}
.ledger .side .cap{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-faint);margin-bottom:8px;}
.ledger .connector{display:flex;align-items:center;justify-content:center;position:relative;}
.ledger .connector .line{width:2px;background:var(--accent);height:70%;position:relative;}
.ledger .connector .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);position:absolute;left:-3px;}
.match-row{display:flex;gap:4px;font-size:11.5px;color:var(--ink-soft);margin-bottom:5px;}
.match-row b{color:var(--ink);font-weight:600;}

.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px;}
.toolbar .search{flex:1;min-width:180px;max-width:280px;}
.search-input{position:relative;}
.search-input input{padding-left:28px;}
.search-input::before{content:"⌕";position:absolute;left:9px;top:7px;color:var(--ink-faint);}
.chip-filter{display:flex;gap:5px;flex-wrap:wrap;}
.chip{
  font-size:11px;padding:4px 10px;border-radius:20px;border:1px solid var(--line-strong);cursor:pointer;
  background:#fff;color:var(--ink-soft);font-family:var(--font-mono);
}
.chip.active{background:var(--ink);color:#fff;border-color:var(--ink);}

.section-note{
  font-size:12px;color:var(--ink-soft);background:var(--accent-soft);border:1px solid #e2cd9f;
  padding:10px 14px;border-radius:var(--radius);margin-bottom:16px;
}
.kbd{font-family:var(--font-mono);font-size:10.5px;background:#eceae0;border:1px solid var(--line-strong);border-radius:3px;padding:1px 5px;}

.tab-strip{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;}
.tab-strip .tab{
  padding:9px 16px;font-size:12.6px;color:var(--ink-soft);cursor:pointer;border-bottom:2px solid transparent;font-weight:500;
}
.tab-strip .tab.active{color:var(--ink);border-color:var(--accent);}

.field-row{display:flex;gap:8px;align-items:flex-end;border:1px solid var(--line);padding:10px;border-radius:var(--radius);margin-bottom:8px;background:#fbfaf6;}
.field-row .grow{flex:1;}
.drag-handle{cursor:grab;color:var(--ink-faint);font-family:var(--font-mono);padding:0 4px;}

.progress-bar{height:6px;background:#eceae0;border-radius:3px;overflow:hidden;}
.progress-bar > div{height:100%;background:var(--accent);}

@media (max-width:880px){
  .content{padding:16px;}
  .topbar{padding:12px 16px;}
}
.menu-toggle{display:none;background:none;border:1px solid var(--line-strong);border-radius:var(--radius);padding:6px 9px;cursor:pointer;}
.mobile-more-btn{display:none;background:none;border:1px solid var(--line-strong);border-radius:var(--radius);width:34px;height:34px;font-size:18px;line-height:1;cursor:pointer;color:var(--ink-soft);}
.mobile-topbar-logo{display:none;}
@media (max-width:880px){
  .mobile-more-btn{display:inline-flex;align-items:center;justify-content:center;}
  .mobile-topbar-logo{display:block;height:28px;width:auto;border-radius:3px;}
}
/* ===== Splash screen ===== */
.splash-screen{
  position:fixed;inset:0;background:linear-gradient(160deg, var(--bg-sidebar), #0a1414);
  display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:500;
}
.splash-logo{max-width:220px;margin-bottom:22px;filter:drop-shadow(0 8px 24px rgba(0,0,0,.35));animation:splash-in .5s ease-out;}
.splash-title{
  font-family:var(--font-display);font-weight:700;font-size:38px;letter-spacing:.02em;color:#f6f4ec;
  animation:splash-in .5s ease-out .1s both;
}
.splash-sub{font-family:var(--font-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--teal);margin-top:8px;animation:splash-in .5s ease-out .2s both;}
.splash-bar{width:140px;height:3px;border-radius:3px;background:#22302f;margin-top:28px;overflow:hidden;}
.splash-bar > div{height:100%;width:40%;background:var(--teal);border-radius:3px;animation:splash-load 1.4s ease-in-out infinite;}
@keyframes splash-in{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
@keyframes splash-load{0%{transform:translateX(-100%);}100%{transform:translateX(340%);}}

/* ===== App footer (every screen) ===== */
.app-footer{
  text-align:center;padding:14px 10px 22px;font-family:var(--font-mono);font-size:10.5px;
  letter-spacing:.04em;color:var(--ink-faint);
}

/* ===== Reports list (light panel — fixed hover contrast) ===== */
.report-nav-item{
  padding:9px 12px;border-radius:var(--radius);font-size:12.8px;color:var(--ink-soft);cursor:pointer;
  margin-bottom:1px;border:1px solid transparent;
}
.report-nav-item:hover{background:#f0f2f1;color:var(--ink);}
.report-nav-item.active{background:var(--teal-soft);color:var(--teal-dark);border-color:#bfe6dd;font-weight:600;}

/* ===== Dashboard hero title ===== */
.dash-hero{display:flex;align-items:baseline;gap:14px;margin-bottom:4px;flex-wrap:wrap;}
.dash-hero .wordmark{
  font-family:var(--font-display);font-weight:700;font-size:30px;letter-spacing:.01em;color:var(--ink);
  background:linear-gradient(100deg, var(--ink) 40%, var(--teal-dark) 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.dash-hero .rule{flex:1;height:1px;background:linear-gradient(90deg, var(--line-strong), transparent);min-width:40px;}
.dash-hero .tagline{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);}

/* ===== Mobile app-style bottom navigation ===== */
.bottom-nav{display:none;}
@media (max-width:880px){
  .bottom-nav{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:150;
    background:var(--bg-panel);border-top:1px solid var(--line);
    padding:6px 2px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(0,0,0,.06);
  }
  .bottom-nav-item{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 2px;
    color:var(--ink-faint);font-size:10px;font-weight:500;border:none;background:none;
  }
  .bottom-nav-item .bn-icon{font-size:19px;line-height:1;}
  .bottom-nav-item.active{color:var(--teal-dark);}
  .content{padding-bottom:78px;}
  .sidebar{display:none;}
  .menu-toggle{display:none !important;}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast-host"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js" defer></script>
<script>
/* =========================================================================
   ASSET LEDGER — Fixed Asset Physical Verification & Reconciliation Tool
   Single-file application. All configuration lives in STATE.config and can
   be edited from the Settings module without touching code.
   ========================================================================= */

/* ---------------------------- constants -------------------------------- */
const APP_VERSION = '3.0.0';
const BUILD_STAMP = '2026-08-14-A'; // change this any time you deploy, then check it matches on every device
const STORAGE_KEYS = {
  config: 'fal:config',
  master: 'fal:assetMaster',
  physical: 'fal:physicalAssets',
  matches: 'fal:reconMatches',
  valuations: 'fal:valuations',
  log: 'fal:changeLog',
  meta: 'fal:meta',
  session: 'fal:session',
  outbox: 'fal:outbox',
};

/* =====================================================================
   EDIT-ME: MENU LABELS
   These are the names shown in the left-hand menu. You can rename them
   (the text inside the quotes after "label:") without breaking anything.
   Do not remove the commas or quote marks.
   ===================================================================== */
const VIEWS = [
  { id:'dashboard',      label:'Dashboard',                num:'00', group:'Overview' },
  { id:'master',         label:'Asset Master / FAR',       num:'01', group:'Book Building' },
  { id:'pv',             label:'Physical Verification',    num:'02', group:'Field Data' },

/* ============================ PASSWORD AUTHENTICATION ==========================
   HONEST LIMITS — please read before relying on this:
   - Passwords are never stored or sent in plain text: each one is hashed
     (SHA-256) together with a random per-user salt, and only the hash+salt
     are stored/synced. That is meaningfully better than nothing.
   - However, this is still a single static file with no real server. There
     is no enforced session/token, no protection against a technically
     determined person reading the stored hash (from this device's local
     storage, or from the Users tab if a shared database is connected) and
     attempting to crack it offline given enough time and computing power.
     There is also no automatic account lockout beyond a brief client-side
     delay after repeated failed attempts.
   - Treat this as real, meaningful access control appropriate for a
     trusted internal team — not as a substitute for enterprise-grade
     authentication (e.g. if this tool is ever placed on the open internet
     rather than run from a downloaded file or an internal link).
   ================================================================================ */
async function sha256Hex(text){
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function randomSalt(){
  const arr = new Uint8Array(16);
  crypto.getRandomValues(arr);
  return Array.from(arr).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function hashPassword(password, salt){
  return sha256Hex(salt + ':' + password);
}
async function verifyPassword(user, password){
  if(!user || !user.passwordHash) return false;
  const h = await hashPassword(password, user.passwordSalt || '');
  return h === user.passwordHash;
}
async function setUserPassword(user, newPassword, forceChange){
  user.passwordSalt = randomSalt();
  user.passwordHash = await hashPassword(newPassword, user.passwordSalt);
  user.mustChangePassword = !!forceChange;
}
function randomTempPassword(){
  const words = ['Coral','Amber','Slate','Cedar','Ledger','Delta','Harbor','Meadow','Quartz','Willow'];
  const w = words[Math.floor(Math.random()*words.length)];
  const n = Math.floor(1000 + Math.random()*9000);
  return w + n;
}
let loginAttemptState = { count:0, lockedUntil:0 };
/* True while ANY input/select/textarea anywhere in the document has focus —
   used to stop the periodic background refresh from overwriting a form
   mid-edit. Deliberately document-wide, not scoped to #content: screens
   like the forced password-change page replace the entire #app and have

}

/* Resize/compress an image file to a small base64 thumbnail so it can be
   safely stored in window.storage (which has a 5MB-per-key ceiling).
   This is a LOCAL PREVIEW ONLY — the full-resolution photo should be
   uploaded by the user to the shared Google Drive / OneDrive folder
   configured in Settings; only the shareable link is durable. */
function fileToThumbnail(file, maxDim, cb){
  const reader = new FileReader();
  reader.onload = (e)=>{
    const img = new Image();
    img.onload = ()=>{
      let { width, height } = img;
      if(width > height && width > maxDim){ height = Math.round(height * (maxDim/width)); width = maxDim; }
      else if(height > maxDim){ width = Math.round(width * (maxDim/height)); height = maxDim; }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);
      cb(canvas.toDataURL('image/jpeg', 0.6));
    };
    img.onerror = ()=> cb(null);
    img.src = e.target.result;
  };
  reader.onerror = ()=> cb(null);
  reader.readAsDataURL(file);
}

/* ---------------------------- storage engine ----------------------------
   Two possible backends:
   1. window.storage — provided ONLY when this file is previewed inside
      Claude's own chat interface. Tied to the person's Claude account.
   2. IndexedDB — used automatically whenever this file is opened as a
      plain downloaded .html file in a regular browser (double-clicked,
      opened from WhatsApp/email, etc.) where window.storage does not
      exist. This is what makes the DOWNLOADED tool actually keep data
      between page refreshes.

   IMPORTANT LIMITATION (this is a hard constraint of any single offline
   file, not a bug): IndexedDB is local to one browser on one device.
   Opening the same .html file in Chrome on a laptop and in Chrome on a
   phone are two completely separate, unconnected storage pools — nothing
   you save on one will ever appear on the other by itself. To move data
   between devices, use Configuration → Data & Backup → Export, send that
   one file across (WhatsApp/email/Drive), then Import it on the other
   device. See the "How to Edit This Tool" guide for step-by-step help.
   ---------------------------------------------------------------------- */
const HAS_CLOUD_STORAGE = (typeof window!=='undefined') && !!(window.storage && typeof window.storage.get==='function' && typeof window.storage.set==='function');
const IDB_NAME = 'AssetLedgerDB';
const IDB_STORE = 'kv';
let __idbPromise = null;
function idbOpen(){
  if(__idbPromise) return __idbPromise;
  __idbPromise = new Promise((resolve, reject)=>{
    if(typeof indexedDB === 'undefined'){ reject(new Error('IndexedDB unavailable')); return; }
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = ()=>{ if(!req.result.objectStoreNames.contains(IDB_STORE)) req.result.createObjectStore(IDB_STORE); };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
  return __idbPromise;
}
async function idbGet(key){
  const db = await idbOpen();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(IDB_STORE, 'readonly');
    const req = tx.objectStore(IDB_STORE).get(key);
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
async function idbSet(key, value){
  const db = await idbOpen();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put(value, key);
    tx.oncomplete = ()=> resolve(true);
    tx.onerror = ()=> reject(tx.error);
  });
}

const LocalStore = {
  async get(key){
    if(HAS_CLOUD_STORAGE) return window.storage.get(key, false);
    const value = await idbGet(key);
    if(value === undefined) throw new Error('not found');
    return { key, value, shared:false };
  },
  async set(key, value){
    if(HAS_CLOUD_STORAGE) return window.storage.set(key, value, false);
    await idbSet(key, value);
    return { key, value, shared:false };
  }
};
STATE._storageMode = HAS_CLOUD_STORAGE ? 'cloud' : 'local-device';

/* ============================ SHARED DATABASE (Google Sheets) ==================
   When STATE.config.sheetsWebAppUrl is set, this device talks to a Google Apps
   Script Web App backed by a Google Sheet — see Code.gs / the setup guide.
   That makes the data genuinely shared across everyone's devices, close to
   real time (polling every ~10s), instead of being stuck on one device.

   Design choices, plainly stated:
   - Every write also lands in LocalStore first (instant UI, offline cache).
     The push to Sheets happens after, best-effort. If it fails (no signal),
     the operation queues in STATE.outbox and retries automatically.
   - Tag IDs are the one thing that MUST be centrally allocated — otherwise
     two people verifying assets at the same moment on two different phones
     could get the same Tag ID. That allocation is a real network round
     trip to the Apps Script backend (which serialises it with a lock).
     If there's no signal when a Tag ID is needed, a temporary "TEMP-xxxxx"
     tag is used and swapped for the real one automatically once back online.
   ================================================================================ */
STATE.outbox = [];
STATE.sync = { lastPullAt:null, lastPullOk:null, syncing:false };

function sheetsEnabled(){ return !!(STATE.config && STATE.config.sheetsWebAppUrl); }

async function sheetsCall(action, body, method){
  const url = STATE.config.sheetsWebAppUrl;
  if(!url) throw new Error('No shared database URL configured');
  const opts = method==='GET'
    ? {}
    : { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ action }, body||{})) };
  const finalUrl = method==='GET' ? (url + (url.includes('?')?'&':'?') + 'action=' + encodeURIComponent(action)) : url;
  const res = await fetch(finalUrl, opts);
  if(!res.ok) throw new Error('Network error: ' + res.status);
  const data = await res.json();
  if(!data || data.ok===false) throw new Error((data && data.error) || 'Shared database returned an error');
  return data;
}

function queueOutbox(op){
  STATE.outbox.push(Object.assign({ id: uid('ob'), attempts:0, createdAt:new Date().toISOString() }, op));
  persist('outbox');
}

async function flushOutbox(){
  if(!sheetsEnabled() || STATE.outbox.length===0) return;
  const remaining = [];
  for(const op of STATE.outbox){
    try{
      if(op.type==='save') await sheetsCall('save', { table:op.table, records:[op.record] });
      else if(op.type==='delete') await sheetsCall('deleteRecord', { table:op.table, id:op.id });
      else if(op.type==='log') await sheetsCall('appendLog', { entries:[op.entry] });
      else if(op.type==='config') await sheetsCall('saveConfig', { value: op.value });
      else if(op.type==='claimTag') await claimPendingTag(op.recordId, op.assetGroup, op.locationId);
    }catch(e){
      op.attempts = (op.attempts||0) + 1;
      remaining.push(op);
    }
  }
  STATE.outbox = remaining;
  persist('outbox');
}

async function pushRecord(table, record){
  if(!sheetsEnabled()) return;
  try{ await sheetsCall('save', { table, records:[record] }); }
  catch(e){ queueOutbox({ type:'save', table, record }); }
}
async function pushDelete(table, id){
  if(!sheetsEnabled()) return;

}
async function pushLog(entry){

/* ---- pulling the shared snapshot and merging it into local state ---- */
async function pullFromSheets(){
  if(!sheetsEnabled()) return false;
  STATE.sync.syncing = true;
  try{
    const data = await sheetsCall('bootstrap', null, 'GET');
    if(data.config){
      try{
        const shared = JSON.parse(data.config);
        Object.assign(STATE.config, shared);
      }catch(e){}
    }
    if(Array.isArray(data.users) && data.users.length){
      let anyCorrupted = false;
      STATE.config.users = data.users.map(u=>{
        // Defensive: if a role value ever comes back as something other than
        // one of the configured role names (e.g. a boolean, from a past
        // spreadsheet-column-alignment problem), don't silently lock the
        // account out of every screen — fall back to Admin and flag it, so
        // whoever is signed in can see something is wrong and fix it,
        // rather than staring at an empty sidebar with no way in.
        let role = u.role;
        if(typeof role !== 'string' || !STATE.config.roles.includes(role)){
          anyCorrupted = true;
          role = 'Admin';
        }
        return {
          id:u.id, name:u.name, email:u.email||'', role, active: (u.active===true || u.active==='true'),
          passwordHash: u.passwordHash||'', passwordSalt: u.passwordSalt||'',
          mustChangePassword: (u.mustChangePassword===true || u.mustChangePassword==='true'),
        };
      });
      if(anyCorrupted) toast('One or more team members had unreadable role data in the shared sheet and were reset to Admin as a safety net — please check Configuration → Users & Roles.', 'bad');
    }
    if(Array.isArray(data.master)) STATE.master = data.master.map(inflateMasterRow);
    if(Array.isArray(data.physical)) STATE.physical = data.physical.map(inflatePhysicalRow);
    if(Array.isArray(data.matches)) STATE.matches = data.matches.map(inflateMatchRow);
    if(Array.isArray(data.valuations)) STATE.valuations = data.valuations.map(r=>({ id:r.id, physicalId:r.physicalId, value:Number(r.value)||0, valuationDate:r.valuationDate, valuedBy:r.valuedBy, notes:r.notes||'' }));
    if(Array.isArray(data.log)) STATE.log = data.log;
    persist('config'); persist('master'); persist('physical'); persist('matches'); persist('valuations'); persist('log');
    STATE.sync.lastPullAt = new Date().toISOString();
    STATE.sync.lastPullOk = true;
    return true;
  }catch(e){
    STATE.sync.lastPullOk = false;
    return false;
  }finally{
    STATE.sync.syncing = false;
  }
}
function inflateMasterRow(r){
  let customFields = {}; try{ customFields = JSON.parse(r.customFieldsJson||'{}'); }catch(e){}

/* ---- atomic Tag ID request, with offline fallback ---- */
function tagCounterKey(assetGroupName, locationId){
  const c = STATE.config;
  const grp = groupByName(assetGroupName) || { code:(assetGroupName||'GEN').slice(0,3).toUpperCase() };
  const loc = locationById(locationId);
  const plantCode = loc ? loc.plant.replace(/[^A-Za-z0-9]/g,'').slice(0,4).toUpperCase() : 'GEN';
  return { key: c.tagFormat.resetPerLocation ? `${plantCode}:${grp.code}` : grp.code, plantCode, grpCode: grp.code };
}
async function requestTagId(assetGroupName, locationId){
  const c = STATE.config;
  const { key, plantCode, grpCode } = tagCounterKey(assetGroupName, locationId);
  if(sheetsEnabled()){
    try{
      const res = await sheetsCall('nextTagIds', { counterKey:key, count:1 });
      const seq = res.seqNumbers[0];
      const tag = c.tagFormat.pattern.replace('{PLANT}',plantCode).replace('{GROUP}',grpCode).replace('{SEQ}', String(seq).padStart(c.tagFormat.seqDigits,'0'));
      return { tagId: tag, pending:false };
    }catch(e){
      // offline / server unreachable — issue a temporary local tag, queue a claim for later
      const tempTag = 'TEMP-' + Math.random().toString(36).slice(2,8).toUpperCase();
      return { tagId: tempTag, pending:true };
    }
  }
  // no shared database configured at all — use the simple local counter as before
  const next = (c.tagCounters[key] || 0) + 1;
  c.tagCounters[key] = next;
  persist('config');
  const tag = c.tagFormat.pattern.replace('{PLANT}',plantCode).replace('{GROUP}',grpCode).replace('{SEQ}', String(next).padStart(c.tagFormat.seqDigits,'0'));
  return { tagId: tag, pending:false };
}
async function claimPendingTag(recordId, assetGroupName, locationId){
  const { key, plantCode, grpCode } = tagCounterKey(assetGroupName, locationId);
  const res = await sheetsCall('nextTagIds', { counterKey:key, count:1 });
  const seq = res.seqNumbers[0];
  const tag = STATE.config.tagFormat.pattern.replace('{PLANT}',plantCode).replace('{GROUP}',grpCode).replace('{SEQ}', String(seq).padStart(STATE.config.tagFormat.seqDigits,'0'));
  const p = STATE.physical.find(x=>x.id===recordId);
  if(p){
    p.tagId = tag; p.pendingSync = false;
    persist('physical');
    await pushRecord('physical', physicalToRow(p));
  }
}

function generateTagId(assetGroupName, locationId){
  const c = STATE.config;

  return tag;

/* ---------------------------- persistence -------------------------------- */
async function loadAll(){
  let configWasFoundOnDisk = false;
  const keys = Object.keys(STORAGE_KEYS);
  for(const k of keys){
    try{
      const res = await LocalStore.get(STORAGE_KEYS[k]);
      if(res && res.value !== undefined){
        const parsed = JSON.parse(res.value);
        if(k==='config'){ STATE.config = Object.assign(defaultConfig(), parsed); configWasFoundOnDisk = true; }
        else STATE[k] = parsed;
      }
    }catch(e){ /* key doesn't exist yet - keep defaults */ }
  }
  let pulledFromSheets = false;
  if(sheetsEnabled()){
    pulledFromSheets = await pullFromSheets();
  }
  // A genuinely brand-new install (nothing saved on this device yet, and no
  // shared database pulled anything) gets asked what kind of start it wants,
  // instead of silently loading sample data — important once this tool is
  // handed to a new client rather than just used internally with demo data.
  if(!pulledFromSheets && !configWasFoundOnDisk && STATE.master.length===0 && STATE.physical.length===0){
    STATE.needsFirstRunChoice = true;
  }
  STATE.loaded = true;
}

const persistDebounced = {};
function persist(key){
  return new Promise((resolve)=>{
    if(!persistDebounced[key]){
      persistDebounced[key] = debounce(async ()=>{
        try{ await LocalStore.set(STORAGE_KEYS[key], JSON.stringify(STATE[key])); }
        catch(e){ toast('Could not save data — changes may be lost.', 'bad'); }
        if(key==='config' && sheetsEnabled()){ pushConfig(); pushUsers(); }
        resolve();
      }, 300);
    }
    persistDebounced[key]();
    resolve();
  });
}
async function persistNow(key){
  try{ await LocalStore.set(STORAGE_KEYS[key], JSON.stringify(STATE[key])); }
  catch(e){ toast('Could not save data.', 'bad'); }
  if(key==='config' && sheetsEnabled()){ pushConfig(); pushUsers(); }
}

/* ============================ RECONCILIATION ENGINE =========================
   Implements Stage/Module 4 of the whitepaper:
   - candidates are matched in the configured sequence (default: location ->
     FA class/asset group -> description -> make/model/year/capacity)
   - within a matched bucket, FAR line items are consumed LIFO (latest
     procurement/posting date first) against available physical entries
   - every suggestion requires manual approval before it is treated as a
     confirmed reconciliation (semi-automatic, per whitepaper)
   ============================================================================ */

function normText(s){ return (s||'').toString().trim().toLowerCase(); }

function descriptionSimilar(a,b){
  a = normText(a); b = normText(b);
  if(!a || !b) return false;
  if(a===b) return true;
  return a.includes(b) || b.includes(a);
}

function makeModelScore(far, phy){
  let score = 0, basis = [];
  if(far.make && phy.make && normText(far.make)===normText(phy.make)){ score++; basis.push('make'); }
  if(far.model && phy.model && normText(far.model)===normText(phy.model)){ score++; basis.push('model'); }
  if(far.yearOfMfg && phy.yearOfMfg && String(far.yearOfMfg)===String(phy.yearOfMfg)){ score++; basis.push('year'); }
  if(far.capacity && phy.capacity && normText(far.capacity)===normText(phy.capacity)){ score++; basis.push('capacity'); }
  return { score, basis };
}

function runReconciliation(){
  const order = STATE.config.reconciliationOrder;
  const availableFar = STATE.master.filter(f=>f.status==='unreconciled');
  const availablePhy = STATE.physical.filter(p=>p.status==='unmatched');

  // build buckets keyed by location (always first-class, per whitepaper "asset location" first)
  const usedPhy = new Set();
  const suggestions = [];

  // sort FAR LIFO: latest procurement/posting date first
  const farSorted = [...availableFar].sort((a,b)=> new Date(b.procurementDate||0) - new Date(a.procurementDate||0));

  for(const far of farSorted){
    // candidate physical assets not yet used, matching in configured sequence
    let candidates = availablePhy.filter(p=>!usedPhy.has(p.id));

    for(const step of order){
      if(candidates.length<=1) break;
      if(step==='location'){
        const next = candidates.filter(p=>p.locationId===far.locationId);
        if(next.length) candidates = next;
      } else if(step==='faClass'){
        const next = candidates.filter(p=>normText(p.assetGroup)===normText(far.faClass));
        if(next.length) candidates = next;
      } else if(step==='description'){
        const next = candidates.filter(p=>descriptionSimilar(p.description, far.description));
        if(next.length) candidates = next;
      } else if(step==='makeModel'){
        const scored = candidates.map(p=>({p, s:makeModelScore(far,p).score}));
        const maxS = Math.max(...scored.map(x=>x.s));
        if(maxS>0){ candidates = scored.filter(x=>x.s===maxS).map(x=>x.p); }
      }
    }
    // require at minimum a location + (faClass OR description) match to suggest
    const strictPool = availablePhy.filter(p=>!usedPhy.has(p.id) && p.locationId===far.locationId &&
      (normText(p.assetGroup)===normText(far.faClass) || descriptionSimilar(p.description, far.description)));
    const pool = strictPool.length ? strictPool.filter(p=>candidates.includes(p)) : [];
    const finalPool = pool.length ? pool : (strictPool.length ? strictPool : []);

    if(finalPool.length===0) continue;
    // pick best by makeModel score among final pool
    let best = finalPool[0], bestScore = makeModelScore(far,best);
    for(const p of finalPool.slice(1)){
      const sc = makeModelScore(far,p);
      if(sc.score > bestScore.score){ best = p; bestScore = sc; }
    }
    usedPhy.add(best.id);
    const basis = ['location'];
    if(normText(best.assetGroup)===normText(far.faClass)) basis.push('asset class');
    if(descriptionSimilar(best.description, far.description)) basis.push('description');
    basis.push(...bestScore.basis);

    suggestions.push({
      id: uid('sugg'), farId: far.id, physicalId: best.id,
      basis, confidence: Math.min(100, 40 + basis.length*15),
      status:'suggested', createdDate: new Date().toISOString(),
    });
  }

  // merge with existing matches: drop old suggestions (not yet approved), keep approved/rejected history
  STATE.matches = STATE.matches.filter(m=>m.status!=='suggested');
  STATE.matches.push(...suggestions);
  persist('matches');
  return suggestions.length;
}

function approveMatch(matchId){
  const m = STATE.matches.find(x=>x.id===matchId);
  if(!m) return;
  const far = STATE.master.find(f=>f.id===m.farId);
  const phy = STATE.physical.find(p=>p.id===m.physicalId);
  if(!far || !phy){ toast('Linked record no longer exists.', 'bad'); return; }
  far.status = 'reconciled'; far.pvCode = phy.tagId;
  phy.status = 'matched'; phy.matchedFarId = far.id;
  m.status = 'approved'; m.approvedBy = actorName(); m.approvedDate = new Date().toISOString();
  logChange('reconciliation', m.id, 'status', 'suggested', 'approved',
    `${far.farCode||far.id} matched to ${phy.tagId}`);
  persist('master'); persist('physical'); persist('matches');
  pushRecord('master', farToRow(far)); pushRecord('physical', physicalToRow(phy)); pushRecord('matches', matchToRow(m));
}

function rejectMatch(matchId){
  const m = STATE.matches.find(x=>x.id===matchId);
  if(!m) return;
  m.status = 'rejected'; m.rejectedDate = new Date().toISOString();
  logChange('reconciliation', m.id, 'status', 'suggested', 'rejected', '');
  persist('matches');
  pushRecord('matches', matchToRow(m));
}

function unreconcileFar(farId){
  const far = STATE.master.find(f=>f.id===farId);
  if(!far || far.status!=='reconciled') return;
  const phy = STATE.physical.find(p=>p.matchedFarId===farId);
  if(phy){ phy.status='unmatched'; phy.matchedFarId=''; persist('physical'); pushRecord('physical', physicalToRow(phy)); }
  const m = STATE.matches.find(mm=>mm.farId===farId && mm.status==='approved');
  if(m){ m.status='reverted'; persist('matches'); pushRecord('matches', matchToRow(m)); }
  far.status='unreconciled'; far.pvCode='';
  logChange('reconciliation', farId, 'status', 'reconciled', 'unreconciled', 'Manually reverted');
  persist('master');
  pushRecord('master', farToRow(far));
}

/* ============================ CRUD: ASSET MASTER ============================ */
function upsertFar(data, existingId){
  let rec;
  if(existingId){
    const idx = STATE.master.findIndex(f=>f.id===existingId);
    if(idx>-1){
      const old = STATE.master[idx];
      for(const k of Object.keys(data)){
        if(String(old[k]) !== String(data[k])){
          logChange('assetMaster', existingId, k, old[k], data[k]);
        }
      }
      STATE.master[idx] = rec = Object.assign({}, old, data);
    }
  } else {
    rec = Object.assign({ id: uid('far'), status:'unreconciled', pvCode:'', customFields:{} }, data);
    STATE.master.push(rec);
    logChange('assetMaster', data.farCode||'(new)', 'created', '', 'Asset master record created');
  }
  persist('master');
  if(rec) pushRecord('master', farToRow(rec));
}
function deleteFar(id){
  STATE.master = STATE.master.filter(f=>f.id!==id);

/* ============================ CRUD: PHYSICAL VERIFICATION ===================
   Creating a NEW entry needs a Tag ID, which — when a shared database is
   configured — has to come from the server (so two devices can never be
   handed the same Tag ID). That makes creation asynchronous. Editing an
   existing entry does not need a new tag, so it stays fast/synchronous.

   explicitTagId is used when the asset already carries a legacy barcode
   from a prior audit/system (scanned in via "Scan Barcode") — in that case
   we use the scanned value AS the Tag ID directly instead of allocating a
   new sequential one, after checking it isn't already in use. */
async function upsertPhysical(data, existingId, explicitTagId){
  let rec;
  if(existingId){
    const idx = STATE.physical.findIndex(p=>p.id===existingId);
    if(idx>-1){
      const old = STATE.physical[idx];
      for(const k of Object.keys(data)){
        if(k==='photoThumbnail'){
          if(old[k] !== data[k]) logChange('physicalAsset', existingId, 'photo', '', '(image updated)', 'Local preview photo updated');
          continue;
        }
        if(String(old[k]) !== String(data[k])){
          logChange('physicalAsset', existingId, k, old[k], data[k]);
        }
      }
      STATE.physical[idx] = rec = Object.assign({}, old, data);
    }
  } else {
    let tagId, pending = false;
    if(explicitTagId){
      if(STATE.physical.some(p=>p.tagId===explicitTagId)){
        toast(`Barcode "${explicitTagId}" is already recorded against another asset — please check before continuing.`, 'bad');
        return null;
      }
      tagId = explicitTagId;
    } else {
      const res = await requestTagId(data.assetGroup, data.locationId);
      tagId = res.tagId; pending = res.pending;
    }
    rec = Object.assign({ id: uid('pv'), status:'unmatched', matchedFarId:'', customFields:{}, tagId, pendingSync: !!pending }, data);
    STATE.physical.push(rec);
    logChange('physicalAsset', tagId, 'created', '', pending ? 'Physical verification entry created (offline — temporary tag, will update automatically once back online)' : explicitTagId ? 'Physical verification entry created from a scanned legacy barcode' : 'Physical verification entry created');
    if(pending) queueOutbox({ type:'claimTag', recordId: rec.id, assetGroup: data.assetGroup, locationId: data.locationId });
  }
  persist('physical');
  if(rec) pushRecord('physical', physicalToRow(rec));
  return rec;
}
function deletePhysical(id){
  const p = STATE.physical.find(x=>x.id===id);
  if(p && p.matchedFarId){ toast('Unlink the reconciled match before deleting this entry.', 'bad'); return false; }
  STATE.physical = STATE.physical.filter(x=>x.id!==id);
  logChange('physicalAsset', id, 'deleted', '', '');
  persist('physical');
  pushDelete('physical', id);
  return true;
}

function upsertValuation(physicalId, value, valuationDate, valuedBy, notes){
  let v = STATE.valuations.find(x=>x.physicalId===physicalId);
  if(v){ v.value=value; v.valuationDate=valuationDate; v.valuedBy=valuedBy; v.notes=notes; }
  else { v = { id: uid('val'), physicalId, value, valuationDate, valuedBy, notes }; STATE.valuations.push(v); }
  const p = STATE.physical.find(x=>x.id===physicalId);
  if(p) p.status = 'confirmed-excess';
  logChange('valuation', physicalId, 'value', '', value, 'Valuation recorded for excess unreconciled asset');
  persist('valuations'); persist('physical');
  pushRecord('valuations', valuationToRow(v));
  if(p) pushRecord('physical', physicalToRow(p));
}

/* ============================ STATUTORY DEPRECIATION ENGINE (Phase 1) ==========
   Companies Act and Income-tax Act are calculated completely independently —
   neither is ever derived from the other's configuration. Both read from the
   Asset Master's optional statutory fields (Section 4/5/6 of the spec) and
   the new companiesActConfig / incomeTaxBlocks masters (Section 8/18).

   DELIBERATELY NOT INCLUDED IN PHASE 1 (see the Statutory Depreciation Engine
   note in the setup guide): componentisation, shift working, impairment/
   revaluation adjustment workflow, useful-life-change history, rule
   versioning by financial year, and the full 40+ field asset master
   expansion. These are real, separately-scoped follow-on work, not silently
   dropped — every "Configuration Missing" status below is a visible signal
   pointing at exactly this. */

function fyBounds(dateStr){
  // Indian financial year: 1 Apr to 31 Mar. Falls back to the current date's
  // FY if no usable date is given, so a calculation can still show *a*
  // period rather than crashing on a blank field.
  const d = dateStr ? new Date(dateStr) : new Date();
  if(isNaN(d.getTime())) return fyBounds(null);
  const y = d.getMonth() >= 3 ? d.getFullYear() : d.getFullYear()-1;
  return { start: new Date(y,3,1), end: new Date(y+1,2,31), label: `FY ${y}-${String((y+1)%100).padStart(2,'0')}` };
}
function daysBetweenInclusive(a,b){ return Math.round((b-a)/86400000) + 1; }
function daysUsedInFY(dateStr, fy){
  const d = new Date(dateStr);
  if(isNaN(d.getTime())) return 0;
  const start = d > fy.start ? d : fy.start;
  if(start > fy.end) return 0;
  return daysBetweenInclusive(start, fy.end);
}

function companiesActConfigFor(far){
  return STATE.config.companiesActConfig.find(c=>c.category===far.companiesActCategory && c.active!==false) || null;
}
function incomeTaxBlockFor(far){
  return STATE.config.incomeTaxBlocks.find(b=>b.blockId===far.itBlockId && b.active!==false) || null;
}

/* ---- A. Companies Act, Schedule II — SLM or WDV, pro-rata by days, residual value floor ---- */
function computeCompaniesActDepreciation(far, fy){
  fy = fy || fyBounds(far.depreciationStartDate || far.putToUseDate || far.procurementDate);
  const cfg = companiesActConfigFor(far);
  const usefulLife = far.overrideUsefulLife !== '' && far.overrideUsefulLife != null ? Number(far.overrideUsefulLife) : (cfg ? cfg.usefulLifeYears : null);
  const residualPct = far.overrideResidualPct !== '' && far.overrideResidualPct != null ? Number(far.overrideResidualPct) : (cfg ? cfg.residualPct : null);
  const method = far.overrideMethod || (cfg ? cfg.method : null);
  const depStart = far.depreciationStartDate || far.putToUseDate || far.procurementDate;

  if(!cfg && (usefulLife==null || residualPct==null || !method)){
    return { status:'Configuration Missing', trace:['No Companies Act category configured for this asset, and no per-asset override supplied.'] };
  }
  if(!depStart){
    return { status:'Data Missing', trace:['No Capitalisation Date, Put-to-Use Date, or Procurement Date available to determine when depreciation should start.'] };
  }
  if(usefulLife === 0){
    return { status:'Not Applicable', trace:['Useful life configured as 0 (e.g. Land) — not depreciated under Companies Act.'], periodDep:0, method, usefulLife, residualPct };
  }
  const gross = Number(far.grossBlock)||0;
  const residualValue = Math.round(gross * (residualPct/100) * 100)/100;
  const depreciableAmount = Math.max(gross - residualValue, 0);
  const days = daysUsedInFY(depStart, fy);
  const totalDaysInYear = daysBetweenInclusive(fy.start, fy.end);
  const openingAccumDep = Number(far.accumDep)||0;
  const remainingDepreciable = Math.max(depreciableAmount - openingAccumDep, 0);

  let annualDep;
  const trace = [];
  if(method === 'SLM'){
    annualDep = depreciableAmount / usefulLife;
    trace.push(`SLM: (Gross Block ${gross} − Residual Value ${residualValue}) / Useful Life ${usefulLife} yrs = ${annualDep.toFixed(2)} per year`);
  } else { // WDV — standard Schedule II rate formula: 1 − (residual%/100)^(1/life)
    const rate = residualPct > 0 ? (1 - Math.pow(residualPct/100, 1/usefulLife)) : (1/usefulLife);
    const openingWDV = Math.max(gross - openingAccumDep, 0);
    annualDep = openingWDV * rate;
    trace.push(`WDV: Rate = 1 − (${residualPct}%)^(1/${usefulLife}) = ${(rate*100).toFixed(2)}%`);
    trace.push(`WDV: Opening WDV ${openingWDV} × Rate ${(rate*100).toFixed(2)}% = ${annualDep.toFixed(2)} per year`);
  }
  let periodDep = annualDep * (days/totalDaysInYear);
  periodDep = Math.min(periodDep, remainingDepreciable);
  periodDep = Math.round(Math.max(periodDep,0)*100)/100;
  trace.push(`Pro-rata: ${days} of ${totalDaysInYear} days in ${fy.label} → ${annualDep.toFixed(2)} × ${days}/${totalDaysInYear} = ${(annualDep*(days/totalDaysInYear)).toFixed(2)}`);
  if(periodDep < annualDep*(days/totalDaysInYear) - 0.01) trace.push(`Capped at remaining depreciable amount (${remainingDepreciable.toFixed(2)}) so the asset cannot depreciate below its residual value.`);

  return {
    status:'Calculated', method, usefulLife, residualPct, residualValue, depreciableAmount,
    days, totalDaysInYear, annualDep: Math.round(annualDep*100)/100, periodDep,
    closingWDV: Math.round((gross - openingAccumDep - periodDep)*100)/100, trace, fy: fy.label,
  };
}

/* ---- B. Income-tax Act — Block of Assets, 180-day full/half rate rule ---- */
function computeIncomeTaxBlocks(fy){
  fy = fy || fyBounds(null);
  const blocks = {};
  STATE.master.forEach(f=>{
    if(!f.itBlockId) return;
    blocks[f.itBlockId] = blocks[f.itBlockId] || { blockId:f.itBlockId, openingWDV:0, additionsFull:0, additionsHalf:0, disposals:0, assetIds:[], assetContrib:{} };
    const b = blocks[f.itBlockId];
    b.assetIds.push(f.id);
    const acqDate = f.procurementDate;
    const isCurrentYearAddition = acqDate && new Date(acqDate) >= fy.start && new Date(acqDate) <= fy.end;
    if(isCurrentYearAddition){
      const putToUse = f.putToUseDate || acqDate;
      const days = daysUsedInFY(putToUse, fy);
      const gross = Number(f.grossBlock)||0;
      if(days > 180){ b.additionsFull += gross; b.assetContrib[f.id] = { bucket:'full', amount:gross }; }
      else { b.additionsHalf += gross; b.assetContrib[f.id] = { bucket:'half', amount:gross }; }
    } else {
      b.openingWDV += Number(f.wdv)||0; // pre-existing assets: current WDV stands in for opening block WDV (documented simplification — Phase 1 does not track historical block WDV separately from the asset master)
      b.assetContrib[f.id] = { bucket:'opening', amount:Number(f.wdv)||0 };
    }
    if(f.disposalDate && new Date(f.disposalDate) >= fy.start && new Date(f.disposalDate) <= fy.end){
      b.disposals += Number(f.disposalAmount)||0;
    }
  });

  return Object.values(blocks).map(b=>{
    const cfg = STATE.config.incomeTaxBlocks.find(c=>c.blockId===b.blockId && c.active!==false);
    const wdvBeforeDep = b.openingWDV + b.additionsFull + b.additionsHalf - b.disposals;
    if(!cfg){
      return { ...b, status:'Configuration Missing', wdvBeforeDep, rate:null, fullRateDep:0, halfRateDep:0, totalDep:0, closingWDV:wdvBeforeDep };
    }
    const fullBase = Math.max(b.openingWDV + b.additionsFull - b.disposals, 0);
    const fullRateDep = Math.round(fullBase * (cfg.rate/100) * 100)/100;
    const halfRateDep = Math.round(b.additionsHalf * (cfg.rate/100/2) * 100)/100;
    const totalDep = Math.max(fullRateDep + halfRateDep, 0);
    return {
      ...b, status:'Calculated', rate:cfg.rate, description:cfg.description, wdvBeforeDep,
      fullRateDep, halfRateDep, totalDep, closingWDV: Math.round((wdvBeforeDep-totalDep)*100)/100, fy: fy.label,
    };
  });
}
/* Per-asset share of its block's depreciation — a reporting ALLOCATION for
   three-way reconciliation, not itself a separate statutory calculation
   (Income-tax depreciation is fundamentally a block concept — Section 19). */
function incomeTaxAssetShare(far, blocksResult){
  if(!far.itBlockId) return { status:'Configuration Missing', amount:0 };
  const block = blocksResult.find(b=>b.blockId===far.itBlockId);
  if(!block || block.status!=='Calculated') return { status: block?block.status:'Configuration Missing', amount:0 };
  const contrib = block.assetContrib[far.id];
  if(!contrib) return { status:'Data Missing', amount:0 };
  const pool = contrib.bucket==='full' ? (block.openingWDV+block.additionsFull) : contrib.bucket==='half' ? block.additionsHalf : block.openingWDV;
  if(pool <= 0) return { status:'Calculated', amount:0 };
  const rateApplied = contrib.bucket==='half' ? block.rate/2 : block.rate;
  const amount = Math.round(contrib.amount * (rateApplied/100) * 100)/100;
  return { status:'Calculated', amount, bucket:contrib.bucket, blockId:far.itBlockId, rate:rateApplied };
}

function depreciationMaterialityStatus(diff, base){
  const m = STATE.config.depreciationMateriality;
  const pct = base ? Math.abs(diff)/Math.abs(base)*100 : 0;
  if(Math.abs(diff) <= m.absoluteThreshold) return 'Matched';
  if(pct <= m.percentThreshold) return 'Matched';
  if(pct <= m.percentThreshold*2) return 'Review';
  return 'Exception';
}
function primaryDifferenceReason(far, ca, it){
  if(ca.status!=='Calculated' || it.status!=='Calculated') return 'Configuration/data missing for one or more calculations';
  const reasons = [];
  if(far.overrideMethod) reasons.push('Depreciation method differs (Companies Act vs Income-tax are inherently different bases)');
  const cfg = companiesActConfigFor(far);
  if(cfg && ca.usefulLife && Math.abs(ca.usefulLife - cfg.usefulLifeYears) > 0.01) reasons.push('Useful life overridden from standard');
  if(it.bucket === 'half') reasons.push('180-day restriction applied (asset used ≤180 days in the year)');
  if(!reasons.length) reasons.push('Different statutory bases (Companies Act useful-life method vs Income-tax block rate) — no single overriding factor identified');
  return reasons[0];
}

/* ---- Reports ---- */
function reportCompaniesActDepreciation(){
  const fy = fyBounds(null);
  return STATE.master.map(f=>{
    const r = computeCompaniesActDepreciation(f, fy);
    return {
      'FAR Code': f.farCode, 'Description': f.description, 'FA Class': f.faClass,
      'Companies Act Category': f.companiesActCategory||'(not set)', 'Method': r.method||'', 'Useful Life (yrs)': r.usefulLife??'',
      'Residual %': r.residualPct??'', 'Gross Block': f.grossBlock, 'Depreciation Start': f.depreciationStartDate||f.putToUseDate||f.procurementDate,
      'Eligible Days': r.days??'', 'Annual Depreciation': r.annualDep??'', 'Period Depreciation': r.periodDep??'',
      'Closing WDV (Companies Act)': r.closingWDV??'', 'Status': r.status,
    };
  });
}
function reportIncomeTaxBlocks(){
  const fy = fyBounds(null);
  const blocks = computeIncomeTaxBlocks(fy);
  return blocks.map(b=>({
    'Block': b.blockId, 'Description': b.description||'', 'Opening WDV': Math.round(b.openingWDV*100)/100,
    'Additions (>180 days)': Math.round(b.additionsFull*100)/100, 'Additions (≤180 days)': Math.round(b.additionsHalf*100)/100,
    'Disposals': Math.round(b.disposals*100)/100, 'WDV Before Depreciation': Math.round(b.wdvBeforeDep*100)/100,
    'Rate (%)': b.rate??'', 'Full-Rate Depreciation': b.fullRateDep??0, 'Half-Rate Depreciation': b.halfRateDep??0,
    'Total Depreciation': b.totalDep??0, 'Closing WDV': b.closingWDV??'', 'Assets in Block': b.assetIds.length, 'Status': b.status,
  }));
}
function reportThreeWayReconciliation(){
  const fy = fyBounds(null);
  const blocks = computeIncomeTaxBlocks(fy);
  const bookEstimates = {}; // computed once, not per-asset — matters at scale (Section 43)
  reportDepreciation().forEach(r=>{ bookEstimates[r['FAR Code']] = r['Current Year Depreciation (est.)']; });
  return STATE.master.map(f=>{
    const ca = computeCompaniesActDepreciation(f, fy);
    const it = incomeTaxAssetShare(f, blocks);
    const books = bookEstimates[f.farCode] || 0;
    const caAmt = ca.status==='Calculated' ? ca.periodDep : null;
    const itAmt = it.status==='Calculated' ? it.amount : null;
    const bvca = (caAmt!=null) ? Math.round((books-caAmt)*100)/100 : null;
    const bvit = (itAmt!=null) ? Math.round((books-itAmt)*100)/100 : null;
    const cavit = (caAmt!=null && itAmt!=null) ? Math.round((caAmt-itAmt)*100)/100 : null;
    return {
      'FAR Code': f.farCode, 'Description': f.description, 'FA Class': f.faClass,
      'Books Depreciation (est.)': books, 'Companies Act Depreciation': caAmt??'N/A', 'Income-tax Depreciation (allocated)': itAmt??'N/A',
      'Books vs Companies Act': bvca??'', 'Books vs Income-tax': bvit??'', 'Companies Act vs Income-tax': cavit??'',
      'Primary Difference Reason': (caAmt!=null&&itAmt!=null) ? primaryDifferenceReason(f, ca, it) : 'Configuration/data missing',
      'Materiality (Books vs CA)': bvca!=null ? depreciationMaterialityStatus(bvca, books) : 'N/A',
    };
  });
}
function reportDepreciationExceptions(){
  const fy = fyBounds(null);
  const blocks = computeIncomeTaxBlocks(fy);
  const rows = [];
  STATE.master.forEach(f=>{
    const ca = computeCompaniesActDepreciation(f, fy);
    const it = incomeTaxAssetShare(f, blocks);
    const issues = [];
    if(!f.companiesActCategory) issues.push('Missing Companies Act category');
    if(!f.itBlockId) issues.push('Missing Income-tax block');
    if(!f.putToUseDate && !f.capitalisationDate) issues.push('Missing Put-to-Use / Capitalisation date');
    if(ca.status==='Configuration Missing') issues.push('Companies Act: configuration missing');
    if(it.status==='Configuration Missing') issues.push('Income-tax: configuration missing');
    if(ca.status==='Calculated' && ca.periodDep < 0) issues.push('Negative depreciation calculated');
    if(Number(f.wdv) < 0) issues.push('Negative WDV');
    if(f.disposalDate && ca.status==='Calculated' && new Date(f.disposalDate) < new Date(f.depreciationStartDate||f.procurementDate)) issues.push('Disposal date before depreciation start date');
    if(issues.length) rows.push({ 'FAR Code': f.farCode, 'Description': f.description, 'Exceptions': issues.join('; ') });
  });
  return rows;
}

function reportFASchedule(){

    byClass[f.faClass].count++; byClass[f.faClass].gross += Number(f.grossBlock)||0;
    byClass[f.faClass].dep += Number(f.accumDep)||0; byClass[f.faClass].wdv += Number(f.wdv)||0;

}
function reportNilWdv(){

    'Location': locationLabel(locationById(f.locationId)), 'Gross Block': f.grossBlock,

  }));
}
function reportMissingFields(){
  const rows = [];
  const reqMaster = masterFieldDefs().filter(fd=> STATE.config.masterCustomFields.find(c=>c.key===fd.key && c.required));
  STATE.master.forEach(f=>{
    const missing = [];
    if(!f.description) missing.push('description'); if(!f.faClass) missing.push('faClass');
    if(!f.procurementDate) missing.push('procurementDate');
    reqMaster.forEach(fd=>{ if(!f.customFields[fd.key]) missing.push(fd.label); });
    if(missing.length) rows.push({ 'Record':'FAR '+(f.farCode||f.id), 'Missing Fields': missing.join(', ') });
  });
  STATE.physical.forEach(p=>{
    const missing = [];
    if(!p.description) missing.push('description'); if(!p.assetGroup) missing.push('assetGroup');
    if(missing.length) rows.push({ 'Record':'PV '+p.tagId, 'Missing Fields': missing.join(', ') });
  });
  return rows;

function reportValuations(){

/* ============================ MODAL SYSTEM =================================== */
function openModal(innerHTML, opts){
  closeModal();
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.id = 'modal-backdrop';
  backdrop.innerHTML = innerHTML;
  backdrop.addEventListener('mousedown', (e)=>{ if(e.target===backdrop) closeModal(); });
  document.body.appendChild(backdrop);
  document.querySelectorAll('.modal-close, [data-close-modal]').forEach(b=>b.addEventListener('click', closeModal));
  if(opts && opts.onMount) opts.onMount(backdrop);
  document.addEventListener('keydown', escCloseHandler);
}
function escCloseHandler(e){ if(e.key==='Escape') closeModal(); }
function closeModal(){
  const b = document.getElementById('modal-backdrop');
  if(b) b.remove();
  document.removeEventListener('keydown', escCloseHandler);
}

  const emailInput = document.getElementById('signin-email');

    if(loginThrottled()){
      errorBox.textContent = 'Too many attempts — please wait 15 seconds and try again.';

    const email = emailInput.value.trim();
    if(!email || !pwInput.value){ errorBox.textContent = 'Enter your login ID and password.'; return; }
    let u = findUserByEmail(email);
    let ok = u ? await verifyPassword(u, pwInput.value) : false;
    // If it failed and a shared database is connected, the account may have
    // just been created/reset on another device and not reached us yet —
    // pull a fresh snapshot once and retry before giving up. This avoids a
    // false "incorrect password" right after an Admin reset elsewhere.
    if(!ok && sheetsEnabled()){

      return;
    }
    recordLoginSuccess();
    setCurrentUser(u.id);
    render();
  }
  document.getElementById('signin-go').addEventListener('click', attempt);
  pwInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') attempt(); });
  emailInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') pwInput.focus(); });
  emailInput.focus();
}

function counts(){
  const totalFar = STATE.master.length;
  const reconciled = STATE.master.filter(f=>f.status==='reconciled').length;
  const unreconciled = totalFar - reconciled;
  const excess = STATE.physical.filter(p=>p.status==='unmatched').length;
  const suggested = STATE.matches.filter(m=>m.status==='suggested').length;
  return { totalFar, reconciled, unreconciled, excess, suggested, totalPhysical: STATE.physical.length };
}

/* ============================ DASHBOARD VALUE SUMMARIES ========================
   "Book Value"          = Gross Block of FAR lines in that bucket
   "Physical Value"      = Gross Block of FAR lines that have been physically
                            confirmed (reconciled) + assigned value of excess
                            physical items valued in that bucket
   "Reconciled Value"    = Gross Block of FAR lines with status = reconciled
   "Unreconciled Value"  = Gross Block of FAR lines with status = unreconciled
   Recomputed fresh from STATE on every render — always reflects the latest
   data (no caching), so the dashboard is "live".
   ================================================================================ */
function procurementYear(dateStr){
  if(!dateStr) return 'Unknown';
  const d = new Date(dateStr);
  if(isNaN(d.getTime())) return 'Unknown';
  return String(d.getFullYear());
}

function buildValueSummary(bucketFn){
  const buckets = {};
  const touch = (key)=>{ if(!buckets[key]) buckets[key] = { key, book:0, physical:0, reconciled:0, unreconciled:0 }; return buckets[key]; };

  STATE.master.forEach(f=>{
    const key = bucketFn(f);
    const b = touch(key);
    const gross = Number(f.grossBlock)||0;
    b.book += gross;
    if(f.status === 'reconciled'){ b.reconciled += gross; b.physical += gross; }
    else { b.unreconciled += gross; }
  });
  // excess physical assets that have been valued also count toward "physical value"
  // bucketed by their own asset group / verified-year since they carry no FAR class/date
  STATE.valuations.forEach(v=>{
    const p = STATE.physical.find(x=>x.id===v.physicalId);
    if(!p) return;
    const key = bucketFn({ faClass: p.assetGroup, procurementDate: p.verifiedDate });
    const b = touch(key);
    b.physical += Number(v.value)||0;
  });
  return Object.values(buckets).sort((a,b)=> a.key<b.key?-1:a.key>b.key?1:0);
}
function valueSummaryByYear(){ return buildValueSummary(f=>procurementYear(f.procurementDate)); }
function valueSummaryByClass(){ return buildValueSummary(f=>f.faClass || 'Unclassified'); }

  return `
    <div class="panel" style="margin-bottom:16px;">
      <div class="panel-head"><div><h3>${esc(title)}</h3><div class="desc">${esc(desc)}</div></div></div>
      <div class="table-wrap">

          <tbody>
            ${rows.length ? rows.map(r=>{
              const pct = r.book ? Math.round((r.reconciled/r.book)*100) : 0;

              </tr>`;

          </tbody>
          ${rows.length ? `<tfoot><tr style="font-weight:600;background:#faf8f2;">

  `;
}

function renderStatutoryDepSummary(){
  const fy = fyBounds(null);
  const blocks = computeIncomeTaxBlocks(fy);
  const bookEstimates = {};
  reportDepreciation().forEach(r=>{ bookEstimates[r['FAR Code']] = r['Current Year Depreciation (est.)']; });
  let totalBook=0, totalCA=0, totalIT=0, exceptions=0, missingMapping=0;
  STATE.master.forEach(f=>{
    totalBook += Number(bookEstimates[f.farCode])||0;
    const ca = computeCompaniesActDepreciation(f, fy);
    if(ca.status==='Calculated') totalCA += ca.periodDep;
    const it = incomeTaxAssetShare(f, blocks);
    if(it.status==='Calculated') totalIT += it.amount;
    if(!f.companiesActCategory || !f.itBlockId) missingMapping++;
    if(ca.status==='Configuration Missing' || it.status==='Configuration Missing') exceptions++;
  });
  return `
    <div class="grid grid-4">
      <div class="stat-card"><div class="eyebrow">Book Depreciation (est.)</div><div class="value">${fmtNum(Math.round(totalBook))}</div><div class="foot">Current year, existing estimate method</div></div>
      <div class="stat-card accent"><div class="eyebrow">Companies Act Depreciation</div><div class="value">${fmtNum(Math.round(totalCA))}</div><div class="foot">${fy.label}, statutory calculation</div></div>
      <div class="stat-card good"><div class="eyebrow">Income-tax Depreciation</div><div class="value">${fmtNum(Math.round(totalIT))}</div><div class="foot">Block-of-assets, allocated to assets</div></div>
      <div class="stat-card bad"><div class="eyebrow">Assets Needing Attention</div><div class="value">${missingMapping}</div><div class="foot">${exceptions} with configuration missing · ${missingMapping} unmapped to a statutory category/block</div></div>
    </div>
  `;
}

/* ============================ ASSET MASTER (FAR / BOOK BUILDING) ============= */
function filteredMaster(){
  let rows = STATE.master.slice();
  const q = normText(STATE.ui.masterSearch);
  if(q) rows = rows.filter(f=> normText(f.farCode+' '+f.description+' '+f.make+' '+f.model).includes(q));
  if(STATE.ui.masterFilter!=='all') rows = rows.filter(f=>f.status===STATE.ui.masterFilter);
  const { key, dir } = STATE.ui.masterSort;
  rows.sort((a,b)=>{
    let av=a[key], bv=b[key];
    if(key==='grossBlock'||key==='wdv'||key==='accumDep'||key==='qty'){ av=Number(av)||0; bv=Number(bv)||0; }
    else if(key==='procurementDate'){ av=new Date(av||0).getTime(); bv=new Date(bv||0).getTime(); }
    else { av=(av||'').toString().toLowerCase(); bv=(bv||'').toString().toLowerCase(); }
    return av<bv ? (dir==='asc'?-1:1) : av>bv ? (dir==='asc'?1:-1) : 0;
  });
  return rows;
}

/* ============================ PHYSICAL VERIFICATION =========================== */
function filteredPhysical(){
  let rows = STATE.physical.slice();
  const q = normText(STATE.ui.pvSearch);
  if(q) rows = rows.filter(p=> normText(p.tagId+' '+p.description+' '+p.make+' '+p.model).includes(q));
  if(STATE.ui.pvFilter!=='all') rows = rows.filter(p=>p.status===STATE.ui.pvFilter);
  const { key, dir } = STATE.ui.pvSort;
  rows.sort((a,b)=>{
    let av=a[key], bv=b[key];
    if(key==='qty'){ av=Number(av)||0; bv=Number(bv)||0; }
    else if(key==='verifiedDate'){ av=new Date(av||0).getTime(); bv=new Date(bv||0).getTime(); }
    else { av=(av||'').toString().toLowerCase(); bv=(bv||'').toString().toLowerCase(); }
    return av<bv ? (dir==='asc'?-1:1) : av>bv ? (dir==='asc'?1:-1) : 0;
  });
  return rows;
}

        verifiedBy: document.getElementById('p-verifiedBy').value,
        verifiedDate: document.getElementById('p-verifiedDate').value,
        imageNote: document.getElementById('p-imageNote').value,
        customFields,
      };
      const btn = document.getElementById('save-pv');
      btn.disabled = true; btn.textContent = existing ? 'Saving…' : (forcedTagId ? 'Saving…' : 'Requesting Tag ID…');
      const rec = await upsertPhysical(data, existing?existing.id:null, forcedTagId||null);
      if(!rec){ btn.disabled=false; btn.textContent = existing?'Save changes':'Save entry'; return; }
      closeModal(); render();
      if(!existing && rec.pendingSync) toast(`Saved with temporary tag ${rec.tagId} — no signal right now. It will get its real Tag ID automatically once you're back online.`, 'warn');
      else toast(existing?'Entry updated.':'Entry saved.', 'good');
    });
  }});
}

/* ============================ LEGACY BARCODE SCANNING ==========================
   For clients who already have physical barcode labels on their assets from
   a prior audit/system. Scanning looks up the code against Asset Master's
   FAR Code and any custom field (so a "Legacy Barcode" custom field, if you
   add one under Configuration → Master Fields, gets matched automatically),
   and if found, auto-fills the Physical Verification form. Either way, the
   scanned code itself becomes the Tag ID — never regenerated. */
function findFarByAnyCode(code){
  const norm = String(code).trim();
  if(!norm) return null;
  return STATE.master.find(f=>{
    if(String(f.farCode).trim()===norm) return true;
    return Object.values(f.customFields||{}).some(v=>String(v).trim()===norm);
  }) || null;
}

function openBarcodeScanModal(onDetected){

    let stopped = false;
    function stopScanner(){
      if(stopped) return; stopped = true;
      try{ if(typeof Quagga!=='undefined') Quagga.stop(); }catch(e){}
    }
    backdrop.addEventListener('click', (e)=>{ if(e.target.classList.contains('modal-close') || e.target.hasAttribute('data-close-modal')) stopScanner(); });
    document.getElementById('scan-manual-go').addEventListener('click', ()=>{

      if(v){ stopScanner(); closeModal(); onDetected(v); }

      document.getElementById('scan-video-wrap').textContent = 'The camera scanner library could not load (needs an internet connection the first time). Use the manual entry box below instead.';
      return;
    }
    try{
      Quagga.init({
        inputStream: { name:'Live', type:'LiveStream', target: document.getElementById('scan-video-wrap'), constraints:{ facingMode:'environment' } },
        decoder: { readers: ['code_128_reader','ean_reader','ean_8_reader','code_39_reader','codabar_reader','upc_reader'] },

        if(err){ document.getElementById('scan-video-wrap').textContent = 'Could not start the camera — check camera permissions for this browser, or use manual entry below.'; return; }
        if(!stopped) Quagga.start();
      });
      Quagga.onDetected(function(result){
        if(stopped) return;
        const code = result && result.codeResult && result.codeResult.text;
        if(!code) return;
        stopScanner(); closeModal(); onDetected(code);
      });
    }catch(e){
      document.getElementById('scan-video-wrap').textContent = 'Camera scanner could not start. Use manual entry below.';
    }
  }});
}

/* ============================ RECONCILIATION VIEW ============================= */
function renderReconciliation(content, actions){
  const editable = !isReadOnly();
  actions.innerHTML = editable ? `<button class="btn btn-accent" id="btn-run-recon">Run auto-reconciliation</button>` : `<span class="pill neutral">View only for your role</span>`;
  const suggested = STATE.matches.filter(m=>m.status==='suggested');
  const approved = STATE.matches.filter(m=>m.status==='approved').sort((a,b)=>new Date(b.approvedDate)-new Date(a.approvedDate));
  const rejected = STATE.matches.filter(m=>m.status==='rejected');
  const tabs = [
    { id:'suggested', label:`Suggested (${suggested.length})` },
    { id:'approved', label:`Approved (${approved.length})` },
    { id:'rejected', label:`Rejected (${rejected.length})` },
    { id:'rules', label:'Matching sequence' },
  ];

  content.innerHTML = `
    <div class="section-note">Sequence per whitepaper Stage 4: location &rarr; FA class &rarr; description &rarr; make/model/year/capacity, consuming FAR lines latest-first (LIFO). Every suggestion needs your approval before the match is confirmed.</div>
    <div class="tab-strip">${tabs.map(t=>`<div class="tab ${STATE.ui.reconTab===t.id?'active':''}" data-tab="${t.id}">${t.label}</div>`).join('')}</div>
    <div id="recon-tab-body"></div>
  `;
  if(editable) document.getElementById('btn-run-recon').addEventListener('click', ()=>{
    const n = runReconciliation();
    toast(n ? `${n} suggestion(s) generated.` : 'No new matches found — everything eligible is already reconciled or lacks a location/class match.', n?'good':'warn');
    render();
  });
  content.querySelectorAll('[data-tab]').forEach(el=>el.addEventListener('click', ()=>{ STATE.ui.reconTab = el.getAttribute('data-tab'); renderReconciliation(content, actions); }));

  const body = document.getElementById('recon-tab-body');
  if(STATE.ui.reconTab==='suggested') renderReconSuggested(body, suggested, editable);
  else if(STATE.ui.reconTab==='approved') renderReconApproved(body, approved, editable);
  else if(STATE.ui.reconTab==='rejected') renderReconRejected(body, rejected);
  else renderReconRules(body);
}

function openCalculationTraceModal(farId){
  const f = STATE.master.find(x=>x.id===farId);
  if(!f) return;
  const fy = fyBounds(null);
  const ca = computeCompaniesActDepreciation(f, fy);
  const blocks = computeIncomeTaxBlocks(fy);
  const it = incomeTaxAssetShare(f, blocks);
  openModal(`
    <div class="modal wide">
      <div class="modal-head"><h3>Calculation trace — ${esc(f.farCode||f.description)}</h3><button class="modal-close">&times;</button></div>
      <div class="modal-body">
        <div class="grid grid-2">
          <div class="panel"><div class="panel-head"><h3 style="font-size:13px;">Companies Act</h3></div>
            <div class="panel-body" style="font-family:var(--font-mono);font-size:11.5px;white-space:pre-wrap;">
${ca.status!=='Calculated' ? esc(ca.status + ': ' + (ca.trace||[]).join(' ')) : esc((ca.trace||[]).join('\n'))}
${ca.status==='Calculated' ? `\nPeriod Depreciation: ${fmtNum(ca.periodDep)}\nClosing WDV: ${fmtNum(ca.closingWDV)}` : ''}
            </div>
          </div>
          <div class="panel"><div class="panel-head"><h3 style="font-size:13px;">Income-tax (asset's share of its block)</h3></div>
            <div class="panel-body" style="font-family:var(--font-mono);font-size:11.5px;white-space:pre-wrap;">
${it.status!=='Calculated' ? esc(it.status) : esc(`Block: ${it.blockId}\nBucket: ${it.bucket==='half'?'≤180 days (half rate)':it.bucket==='full'?'>180 days (full rate)':'opening block'}\nRate applied: ${it.rate}%\nAllocated depreciation: ${it.amount}`)}

    </div>
  `);
}

function renderSettingsShared(body){

  body.innerHTML = `

        </label>
        <button class="btn btn-accent btn-sm" id="s-test">Test connection</button>
        <button class="btn btn-sm" id="s-save">Save &amp; connect</button>
