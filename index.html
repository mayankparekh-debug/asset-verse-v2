      </div>
    </div>
    <div class="section-note" style="margin-top:16px;">
      <b>Please read before sharing this file with your team:</b> anyone who has this Web App URL can read and
      write this data — there's no password on it. Only paste it into copies of this tool you give to your own
      team, the same way you'd treat a sensitive shared link. Photos still work the same manual way as before —

    openConfirm('Disconnect from the shared database?', 'This device will go back to keeping its own separate local copy only.', ()=>{
      c.sheetsWebAppUrl=''; persistNow('config'); render(); toast('Disconnected.', 'good');
    });
  });
}

  body.querySelectorAll('[data-u-name]').forEach(el=>el.addEventListener('input', ()=>{ users[el.getAttribute('data-u-name')].name = el.value; markDirty(); }));
  body.querySelectorAll('[data-u-email]').forEach(el=>el.addEventListener('input', ()=>{ users[el.getAttribute('data-u-email')].email = el.value.trim(); markDirty(); }));
  body.querySelectorAll('[data-u-role]').forEach(el=>el.addEventListener('change', ()=>{ users[el.getAttribute('data-u-role')].role = el.value; markDirty(); }));
  body.querySelectorAll('[data-u-active]').forEach(el=>el.addEventListener('change', ()=>{ users[el.getAttribute('data-u-active')].active = el.checked; markDirty(); }));

  async function saveUsers(){
    // validate everything together at save time, rather than field-by-field mid-typing
    const seen = {};
    for(const u of users){
      const email = String(u.email||'').trim().toLowerCase();
      if(!email) continue;
      if(seen[email]){ toast(`Two team members both use "${email}" as their Login ID — make each email unique before saving.`, 'bad'); return false; }
      seen[email] = true;
    }
    persist('config');
    if(sheetsEnabled()) await pushUsers(); // push immediately rather than waiting on the debounce, so "Finish setup" right after Save is never racing an in-flight save
    dirty = false; dirtyFlag.style.display = 'none';
    toast('Saved.', 'good');
    return true;
  }
  document.getElementById('save-users-btn').addEventListener('click', saveUsers);

  body.querySelectorAll('[data-u-reset]').forEach(el=>el.addEventListener('click', ()=>openResetPasswordModal(users[Number(el.getAttribute('data-u-reset'))])));
  body.querySelectorAll('[data-u-del]').forEach(el=>el.addEventListener('click', ()=>{
    const idx = Number(el.getAttribute('data-u-del'));
    if(users[idx].id === STATE.session.currentUserId) return;
    const removedId = users[idx].id;
    openConfirm('Remove this team member?', 'They will no longer be able to sign in.', async ()=>{
      users.splice(idx,1);
      persist('config');
      await pushDelete('users', removedId); // must explicitly delete the row — pushing the remaining list only upserts, it never removes rows that are gone locally
      rerender(); toast('Removed.', 'good');
    });
  }));
  document.getElementById('add-user-cfg').addEventListener('click', ()=>{
    openNewUserModal();
  });
  const finishBtn = document.getElementById('finish-setup-btn');
  if(finishBtn) finishBtn.addEventListener('click', async ()=>{
    if(dirty){
      const ok = await saveUsers();
      if(!ok) return;
    }
    const hasRealAdmin = STATE.config.users.some(u=>u.role==='Admin' && u.email && u.passwordHash);
    if(!hasRealAdmin){
      toast('Add or edit at least one real Admin account with an email and password, click Save Changes, then try Finish again.', 'bad');
      return;
    }
    openConfirm('Finish initial setup?', 'This locks the temporary bypass permanently and returns everyone — including you — to normal secure sign-in.', ()=>{
      STATE.config.setupComplete = true;
      STATE.session.currentUserId = null;
      persistNow('config'); persistNow('session');
      toast('Setup finished — normal sign-in is now required.', 'good');
      render();
    });
  });
}

function openResetPasswordModal(user){
  openModal(`
    <div class="modal">
      <div class="modal-head"><h3>Reset password — ${esc(user.name)}</h3><button class="modal-close">&times;</button></div>
      <div class="modal-body">
        <div class="hint" style="margin-bottom:10px;">Login ID: <b>${esc(user.email||'(no email set)')}</b></div>
        <label class="field"><span class="lbl">New temporary password</span>
          <div style="display:flex;gap:8px;"><input type="text" id="rp-pw" value="${esc(randomTempPassword())}"><button class="btn btn-sm" id="rp-generate" type="button">Generate another</button></div>
        </label>
        <div class="hint">They'll be required to set their own password the next time they sign in.</div>
      </div>
      <div class="modal-foot"><button class="btn" data-close-modal>Cancel</button><button class="btn btn-danger" id="rp-save">Reset password</button></div>
    </div>
  `, { onMount:()=>{
    document.getElementById('rp-generate').addEventListener('click', ()=>{ document.getElementById('rp-pw').value = randomTempPassword(); });
    document.getElementById('rp-save').addEventListener('click', async ()=>{
      const pw = document.getElementById('rp-pw').value;
      if(pw.length < 6){ toast('Password must be at least 6 characters.', 'bad'); return; }
      await setUserPassword(user, pw, true);
      persistNow('config');
      const btn = document.getElementById('rp-save');
      btn.disabled = true; btn.textContent = 'Saving…';
      let pushed = true;
      if(sheetsEnabled()){
        // push immediately and confirm it actually reached the shared database,
        // rather than relying on the next background poll — this is what was
        // causing a stale "Incorrect password" right after a reset.
        try{ await sheetsCall('save', { table:'users', records:[{ id:user.id, name:user.name, email:user.email||'', role:user.role, active:user.active!==false, passwordHash:user.passwordHash, passwordSalt:user.passwordSalt, mustChangePassword:true, updatedAt:new Date().toISOString() }] }); }
        catch(e){ pushed = false; queueOutbox({ type:'save', table:'users', record:{ id:user.id, name:user.name, email:user.email||'', role:user.role, active:user.active!==false, passwordHash:user.passwordHash, passwordSalt:user.passwordSalt, mustChangePassword:true, updatedAt:new Date().toISOString() } }); }
      }
      closeModal();
      toast(pushed
        ? `Password reset. Temporary password: ${pw} — share it with ${user.name}. It's ready to use now.`
        : `Password reset locally, but could not reach the shared database just now — it will sync automatically once connectivity returns. Wait a moment before sharing the new password with ${user.name}.`,
        pushed?'good':'warn');
    });
  }});
}

      ${cloudMode
        ? 'You are viewing this tool inside Claude — data is saved to your Claude account and follows you across the chat.'
        : 'You opened this tool as a downloaded file. Your data is saved locally inside <b>this specific browser on this specific device</b> (using a technology called IndexedDB) — it is NOT sent anywhere, and it will NOT automatically appear if you open the same file on another phone, laptop, or even a different browser on the same device.'}
    </div>
    <div class="panel"><div class="panel-head"><div><h3>Moving data between devices (e.g. mobile → laptop)</h3><div class="desc">The only way to move data between two separate installs of this file.</div></div></div>
      <div class="panel-body">
        <ol style="margin:0 0 12px;padding-left:20px;font-size:12.5px;color:var(--ink-soft);">
          <li style="margin-bottom:6px;">On the device with the data you want to move (e.g. your phone after a day of field verification), click <b>Export full backup (.json)</b> below.</li>
          <li style="margin-bottom:6px;">Send that one file to your other device — WhatsApp, email, or a Drive/OneDrive upload all work fine.</li>
          <li style="margin-bottom:6px;">On the other device, open this same tool, come back to this screen, and click <b>Import backup (.json)</b>, then choose the file you just received.</li>
          <li>That device now has everything the first device had, including asset photos' local previews and links.</li>
        </ol>
        <button class="btn btn-accent" id="btn-export-json">Export full backup (.json)</button>
        <div style="height:12px;"></div>
        <button class="btn" id="btn-import-json">Import backup (.json)</button>
        <input type="file" id="file-import-json" accept=".json" style="display:none;">
        <div class="hint" style="margin-top:8px;">Importing replaces all current data on this device with the contents of the file.</div>
      </div>
    </div>
    <div class="panel" style="margin-top:16px;"><div class="panel-head"><div><h3>Starting a new client engagement</h3><div class="desc">Reuse this same tool for a different client without carrying over the previous one's data.</div></div></div>
      <div class="panel-body">
        <p style="font-size:12.5px;color:var(--ink-soft);margin-top:0;">This clears all asset records, physical verification entries, reconciliation history and the change log on this device, disconnects any shared database link, and resets the client/organisation name and reporting period — while keeping your firm's own logo and branding. Export a backup first if you want to keep a copy of the outgoing client's data.</p>
        <button class="btn btn-danger" id="btn-new-engagement">Prepare for a new client engagement</button>
      </div>
    </div>
    <div class="section-note" style="margin-top:16px;">
      <b>Scope note on OCR:</b> the whitepaper calls for an OCR reader to auto-fill invoice fields. This build supports manual invoice entry and image/file references; wiring in an OCR engine is a configuration-level extension point (a provider hook) rather than something to embed by default, given accuracy trade-offs on scanned invoices. Direct ERP (SAP/Oracle/Navision/Tally) connectors are similarly represented here via CSV/Excel import — live API integration would be a separate backend service.
    </div>
    <div class="section-note">
      <b>Scope note on photos:</b> this tool cannot sign in to Google Drive/OneDrive on your behalf (that needs an authenticated backend). It keeps a small local preview only on the device that took the photo, and opens your configured Drive/OneDrive folder so you can upload the full photo yourself — see the numbered steps inside the Photo dialog in Physical Verification.
    </div>
    <div class="hint" style="margin-top:16px;text-align:right;">Asset Ledger version ${APP_VERSION}</div>
  `;
  document.getElementById('btn-new-engagement').addEventListener('click', ()=>{
    openConfirm('Prepare for a new client engagement?', 'This permanently clears this device\'s asset data, reconciliation history, and change log, and disconnects any shared database. This cannot be undone — export a backup first if you need one.', ()=>{
      STATE.master = []; STATE.physical = []; STATE.matches = []; STATE.valuations = []; STATE.log = [];
      STATE.config.sheetsWebAppUrl = ''; STATE.config.tagCounters = {};
      STATE.config.orgName = ''; STATE.config.fyLabel = '';
      STATE.session.currentUserId = null;
      persistNow('master'); persistNow('physical'); persistNow('matches'); persistNow('valuations'); persistNow('log'); persistNow('config'); persistNow('session');
      toast('Ready for a new engagement.', 'good');
      render();
    });
  });
  document.getElementById('btn-export-json').addEventListener('click', ()=>{
    const dump = { config: STATE.config, master: STATE.master, physical: STATE.physical, matches: STATE.matches, valuations: STATE.valuations, log: STATE.log, exportedAt: new Date().toISOString(), appVersion: APP_VERSION };
    const blob = new Blob([JSON.stringify(dump, null, 2)], { type:'application/json' });
    const url = URL.createObjectURL(blob); const a = document.createElement('a');
    a.href = url; a.download = 'asset_ledger_backup_'+todayISO()+'.json'; document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 200);
  });
  document.getElementById('btn-import-json').addEventListener('click', ()=>document.getElementById('file-import-json').click());
  document.getElementById('file-import-json').addEventListener('change', (e)=>{
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const dump = JSON.parse(reader.result);
        openConfirm('Import backup?', 'This replaces all current data with the contents of the selected file.', ()=>{
          STATE.config = Object.assign(defaultConfig(), dump.config||{});
          STATE.master = dump.master||[]; STATE.physical = dump.physical||[]; STATE.matches = dump.matches||[];
          STATE.valuations = dump.valuations||[]; STATE.log = dump.log||[];
          ['config','master','physical','matches','valuations','log'].forEach(persistNow);
          render(); toast('Backup imported.', 'good');
        });
      }catch(err){ toast('That file could not be read as a valid backup.', 'bad'); }
    };
    reader.readAsText(file);
  });
}

/* ============================ INIT ============================================ */
async function init(){
  document.getElementById('app').innerHTML = `<div style="padding:60px;text-align:center;color:#888;font-family:sans-serif;">Loading asset ledger…</div>`;
  await loadAll();
  render();
  // keep the dashboard "live" — recompute its tables/stats every few seconds
  // without requiring the user to navigate away and back. Guarded on
  // currentUser() so this never interrupts someone still on the sign-in /
  // password screen (a re-render there would wipe whatever they'd typed) —
  // and on isEditingFormField() so it never yanks a page out from under
  // someone actively editing a plain (non-modal) form, e.g. Users & Roles.
  setInterval(()=>{ if(currentUser() && !currentUser().mustChangePassword && STATE.view==='dashboard' && !document.getElementById('modal-backdrop') && !isEditingFormField()){ render(); } }, 6000);

  if(sheetsEnabled()){
    // pull the shared snapshot regularly so everyone's screens converge —
    // skip the refresh while a modal is open, while someone is actively
    // typing in a form field on the page, and skip it entirely before
    // sign-in.
    setInterval(async ()=>{
      if(!currentUser()) return;
      if(currentUser().mustChangePassword) return; // never disturb someone stuck on the forced password-change screen
      if(STATE.session.currentUserId === '__setup_bypass__') return; // never let a background pull overwrite in-progress initial setup
      if(document.getElementById('modal-backdrop')) return;
      if(isEditingFormField()) return;
      const ok = await pullFromSheets();
      if(ok && currentUser() && !currentUser().mustChangePassword && !isEditingFormField()) render();
    }, 10000);
    // retry anything that failed to reach the shared database earlier
    setInterval(flushOutbox, 5000);
    if(typeof window!=='undefined' && window.addEventListener){
      window.addEventListener('online', flushOutbox);
    }
  }
}
init();
</script>

if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}
</script>
